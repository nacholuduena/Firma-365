<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Firma-365 | Monitoreo de Flota{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/static/css/dashboard.css" rel="stylesheet">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <!-- Sidebar -->
    <nav id="sidebar" class="sidebar">
        <div class="sidebar-header">
            <h4><i class="bi bi-truck"></i> Firma-365</h4>
            <small class="text-muted">Monitoreo de Flota</small>
        </div>
        <ul class="nav flex-column">
            <li class="nav-item">
                <a class="nav-link {% if page == 'dashboard' %}active{% endif %}" href="/">
                    <i class="bi bi-speedometer2"></i> Dashboard
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link {% if page == 'vehiculos' %}active{% endif %}" href="/vehiculos">
                    <i class="bi bi-truck-front"></i> Vehiculos
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link {% if page == 'mantenimiento' %}active{% endif %}" href="/mantenimiento">
                    <i class="bi bi-wrench-adjustable"></i> Mantenimiento
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link {% if page == 'costos' %}active{% endif %}" href="/costos-page">
                    <i class="bi bi-cash-stack"></i> Costos
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link {% if page == 'seguridad' %}active{% endif %}" href="/seguridad">
                    <i class="bi bi-shield-check"></i> Seguridad
                </a>
            </li>
        </ul>
        <div class="sidebar-footer">
            <small class="text-muted">Base de Datos: DQD</small>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        <nav class="navbar navbar-light bg-white border-bottom px-4 mb-4">
            <button class="btn btn-sm btn-outline-secondary d-md-none" onclick="toggleSidebar()">
                <i class="bi bi-list"></i>
            </button>
            <span class="navbar-text">
                <i class="bi bi-database"></i> DQD Database
                <span class="badge bg-success ms-2">Conectado</span>
            </span>
            <span class="navbar-text text-muted">
                <i class="bi bi-clock"></i>
                <span id="current-time"></span>
            </span>
        </nav>

        <div class="container-fluid px-4">
            {% block content %}{% endblock %}
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <script src="/static/js/dashboard.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
